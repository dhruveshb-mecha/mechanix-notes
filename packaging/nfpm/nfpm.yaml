name: mechanix-notes
arch: "${PKG_ARCH}"
platform: linux
version: "${PKG_VERSION}"
release: "${PKG_RELEASE}"
section: utils
priority: optional
maintainer: "Dhanish Patel <dhanishp@ext.mechasystems.com>"
description: A Flutter-based notes app to create, edit, and organize your ideas effortlessly.
homepage: https://github.com/mecha-org/mechanix-notes.git
license: BSD

overrides:
  rpm:
    depends:
      - mechanix-flutter-engine = 3.47.0
  deb:
    depends:
      - "mechanix-flutter-engine (= 3.47.0)"

contents:
  - src: ./stage/bundle/mechanix_notes
    dst: /usr/share/mechanix/mechanix-notes/mechanix_notes
    file_info:
      mode: 0755
  - src: ./stage/bundle/lib/libapp.so
    dst: /usr/share/mechanix/mechanix-notes/lib/libapp.so
  - src: ./stage/bundle/lib/libflutter_tantivy.so
    dst: /usr/share/mechanix/mechanix-notes/lib/libflutter_tantivy.so
  - src: ./stage/bundle/lib/libobjectbox.so
    dst: /usr/share/mechanix/mechanix-notes/lib/libobjectbox.so
  - src: ./stage/bundle/data
    dst: /usr/share/mechanix/mechanix-notes/data
  - src: ./packaging/nfpm/scripts/launcher.sh
    dst: /usr/bin/mechanix_notes
    file_info:
      mode: 0755
  - src: ./org.mechanix.notes.desktop
    dst: /usr/share/applications/org.mechanix.notes.desktop
  - src: ./assets/desktop_icon.png
    dst: /usr/share/icons/hicolor/48x48/apps/org.mechanix.notes.png

scripts:
  postinstall: ./packaging/nfpm/scripts/postinstall.sh
  postremove: ./packaging/nfpm/scripts/postremove.sh
